{% extends "core/base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<main class="p-4">
    <h1 class="mb-4">Вход</h1>

    <form>
        <div class="mb-3">
            <label for="login-name" class="form-label">Логин</label>
            <input type="text"
                   id="login-name"
                   name="login"
                   class="form-control"
                   autocomplete="username"
                   required>
        </div>

        <div class="mb-3">
            <label for="login-password" class="form-label">Пароль</label>
            <input type="password"
                   id="login-password"
                   name="password"
                   class="form-control"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="button" class="btn btn-primary">Войти</button>

        <p class="mt-3">
            Нет аккаунта? <a href="signup.html">Зарегистрироваться</a>
        </p>
    </form>
</main>
{% endblock %}
