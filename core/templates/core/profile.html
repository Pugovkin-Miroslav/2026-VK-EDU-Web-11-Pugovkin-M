{% extends "core/base.html" %}
{% load static %}

{% block title %}Профиль{% endblock %}

{% block content %}
<main class="p-4">
    <h1 class="mb-4">Настройки пользователя</h1>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="profile-login" class="form-label">Логин</label>
            <input type="text"
                   id="profile-login"
                   name="login"
                   class="form-control"
                   value="User login">
        </div>

        <div class="mb-3">
            <label for="profile-email" class="form-label">Email</label>
            <input type="email"
                   id="profile-email"
                   name="email"
                   class="form-control"
                   value="user@mail.ru">
        </div>

        <div class="mb-3">
            <label for="profile-name" class="form-label">Имя</label>
            <input type="text"
                   id="profile-name"
                   name="name"
                   class="form-control"
                   value="Имя пользователя">
        </div>

        <div class="mb-3">
            <label for="profile-avatar" class="form-label">Аватар</label>

            <div class="mb-2">
                <img src="{% static 'core/img/profile-icon.png' %}"
                     alt="Текущий аватар"
                     width="100"
                     height="100">
            </div>

            <input type="file"
                   id="profile-avatar"
                   name="avatar"
                   class="form-control"
                   accept="image/*">
        </div>

        <button type="button" class="btn btn-primary">Сохранить</button>
    </form>
</main>
{% endblock %}
