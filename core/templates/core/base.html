{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">

              content="width=device-width, initial-scale=1">
        <title>{% block title %}VK ответы{% endblock %}</title>

        <link rel="stylesheet" href="{% static 'core/css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
        <link rel="icon" type="image/png" href="{% static 'core/img/favicon-32x32.png' %}">

    <body>

        <div class="content-layout">

        </div>

        <footer>
