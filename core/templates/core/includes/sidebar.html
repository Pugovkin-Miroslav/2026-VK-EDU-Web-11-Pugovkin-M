<aside class="sidebar">
    <section class="sidebar-section">
        <h2 class="sidebar-title">Популярные теги</h2>

        <div class="sidebar-tags">
            {% for popular_tag in popular_tags %}
                <a href="{% url 'questions:tag' popular_tag.slug %}" class="badge text-bg-primary">{{ popular_tag.name }}</a>
            {% empty %}
                <p>Популярных тегов пока нет.</p>
            {% endfor %}
        </div>
    </section>

    <section class="sidebar-section">
        <h2 class="sidebar-title">Лучшие пользователи</h2>

        <ol class="sidebar-members">
            <li><a href="{% url 'core:profile' %}">Пользователь 1</a></li>
            <li><a href="{% url 'core:profile' %}">Пользователь 2</a></li>
            <li><a href="{% url 'core:profile' %}">Пользователь 3</a></li>
        </ol>
    </section>
</aside>
