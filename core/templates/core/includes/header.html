{% load static %}
<header class="container-fluid header-div">
    <a href="{% url 'questions:index' %}">
        <img src="{% static 'core/img/header-logo.png' %}"
             alt="VK ответы"
             class="header-logo">
    </a>
    {% if show_user %}
        <form class="header-search">
            <label for="value" class="visually-hidden">Поиск</label>
            <input id="value"
                   name="value"
                   type="search"
                   placeholder="Найти"
                   required>
        </form>

        <div class="header-user">
            <a href="{% url 'core:profile' %}">
                <img src="{% static 'core/img/profile-icon.png' %}"
                     alt="Аватар пользователя"
                     class="header-avatar">
            </a>

            <div>
                <p>Имя пользователя</p>

                <div class="header-user-links">
                    <a href="{% url 'core:profile' %}">Настройки</a>
                    <a href="{% url 'questions:index' %}">Выйти</a>
                </div>
            </div>
        </div>
    {% else %}
        <div>
            <input id="value"
                   name="value"
                   type="search"
                   placeholder="Найти вопрос"
                   required>
            <a href="{% url 'questions:ask' %}" class="btn btn-primary">Задать вопрос</a>
        </div>
        <nav class="header-auth" aria-label="Авторизация">
            <a href="{% url 'core:signup' %}" class="btn btn-primary">Register</a>
            <a href="{% url 'core:login' %}" class="btn btn-outline-primary">Log in</a>
        </nav>
    {% endif %}
</header>
