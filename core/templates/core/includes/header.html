{% load static %}
<header class="container-fluid header-div">
    <a href="{% url 'questions:index' %}">
        <img src="{% static 'core/img/header-logo.png' %}"
             alt="VK ответы"
             class="header-logo">
    </a>
    {% if request.user.is_authenticated %}
        <form class="header-search">
            <label for="value" class="visually-hidden">Поиск</label>
            <input id="value"
                   name="value"
                   type="search"
                   placeholder="Найти"
                   required>
            <a href="{% url 'questions:ask' %}" class="btn btn-primary">Задать вопрос</a>
        </form>

        <div class="header-user">
            <a href="{% url 'core:profile' %}">
                <img src="{% static 'core/img/profile-icon.png' %}"
                     alt="Аватар пользователя"
                     class="header-avatar">
            </a>

            <div>
                <p>{{ request.user.get_full_name|default:request.user.username }}</p>

                <div class="header-user-links">
                    <a href="{% url 'core:profile' %}">Настройки</a>
                    <form method="post" action="{% url 'core:logout' %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.get_full_path }}">
                        <button type="submit" class="btn btn-link p-0 border-0 align-baseline">Выйти</button>
                    </form>
                </div>
            </div>
        </div>
    {% else %}
        <div>
            <input id="value"
                   name="value"
                   type="search"
                   placeholder="Найти вопрос"
                   required>
            <a href="{% url 'questions:ask' %}" class="btn btn-primary">Задать вопрос</a>
        </div>
        <nav class="header-auth" aria-label="Авторизация">
            <a href="{% url 'core:signup' %}" class="btn btn-primary">Зарегистрироваться</a>
            <a href="{% url 'core:login' %}" class="btn btn-outline-primary">Войти</a>
        </nav>
    {% endif %}
</header>
