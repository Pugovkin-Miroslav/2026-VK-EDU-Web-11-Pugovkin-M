services:
  web:
    build: .
    command: sh -c "python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-development}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media:/app/media

volumes:
  media:
