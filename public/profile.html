<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>Профиль</title>
        <meta name="description" content="Сайт">
        <link rel="stylesheet" href="static/css/bootstrap.min.css">
        <link rel="stylesheet" href="static/css/styles.css">
    </head>

    <body>
        <header class="container-fluid header-div">
            <a href="index.html">
                <img src="static/img/header-logo.png"
                     alt="VK ответы"
                     class="header-logo">
            </a>
            <div>
                <input id="value"
                   name="value"
                   type="search"
                   placeholder="Найти вопрос"
                   required>
                <a href="ask.html" class="btn btn-primary">Задать вопрос</a>
            </div>
            <nav class="header-auth" aria-label="Авторизация">
                <a href="signup.html" class="btn btn-primary">Register</a>
                <a href="login.html" class="btn btn-outline-primary">Log in</a>
            </nav>
        </header>



        <div class="content-layout">
            <main class="p-4">
                <h1 class="mb-4">Настройки пользователя</h1>

                <form>
                    <div class="mb-3">
                        <label for="profile-login" class="form-label">Логин</label>
                        <input type="text"
                               id="profile-login"
                               name="login"
                               class="form-control"
                               value="User login">
                    </div>

                    <div class="mb-3">
                        <label for="profile-email" class="form-label">Email</label>
                        <input type="email"
                               id="profile-email"
                               name="email"
                               class="form-control"
                               value="user@mail.ru">
                    </div>

                    <div class="mb-3">
                        <label for="profile-name" class="form-label">Имя</label>
                        <input type="text"
                               id="profile-name"
                               name="name"
                               class="form-control"
                               value="Имя пользователя">
                    </div>

                    <div class="mb-3">
                        <label for="profile-avatar" class="form-label">Аватар</label>

                        <div class="mb-2">
                            <img src="static/img/profile-icon.png"
                                 alt="Текущий аватар"
                                 width="100"
                                 height="100">
                        </div>

                        <input type="file"
                               id="profile-avatar"
                               name="avatar"
                               class="form-control"
                               accept="image/*">
                    </div>

                    <button type="button" class="btn btn-primary">Сохранить</button>
                </form>
            </main>

            <aside class="sidebar">
                <section class="sidebar-section">
                    <h2 class="sidebar-title">Популярные теги</h2>

                    <div class="sidebar-tags">
                        <a href="tag.html?tag=python" class="badge text-bg-primary">Python</a>
                        <a href="tag.html?tag=django" class="badge text-bg-primary">Django</a>
                        <a href="tag.html?tag=html" class="badge text-bg-primary">HTML</a>
                    </div>
                </section>

                <section class="sidebar-section">
                    <h2 class="sidebar-title">Лучшие пользователи</h2>

                    <ol class="sidebar-members">
                        <li><a href="profile.html">Пользователь 1</a></li>
                        <li><a href="profile.html">Пользователь 2</a></li>
                        <li><a href="profile.html">Пользователь 3</a></li>
                    </ol>
                </section>
            </aside>
        </div>

        <footer>
            <p class="text-default">2026-VK-EDU-Web-11-Pugovkin-M</p>
        </footer>
    </body>
</html>
