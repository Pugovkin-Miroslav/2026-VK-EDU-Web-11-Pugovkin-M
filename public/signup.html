<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>Регистрация</title>
        <meta name="description" content="Сайт">
        <link rel="stylesheet" href="static/css/bootstrap.min.css">
        <link rel="stylesheet" href="static/css/styles.css">
    </head>

    <body>
        <header class="container-fluid header-div">
            <a href="index.html">
                <img src="static/img/header-logo.png"
                     alt="VK ответы"
                     class="header-logo">
            </a>
            <div>
                <input id="value"
                   name="value"
                   type="search"
                   placeholder="Найти вопрос"
                   required>
                <a href="ask.html" class="btn btn-primary">Задать вопрос</a>
            </div>
            <nav class="header-auth" aria-label="Авторизация">
                <a href="signup.html" class="btn btn-primary">Register</a>
                <a href="login.html" class="btn btn-outline-primary">Log in</a>
            </nav>
        </header>


        <div class="content-layout">
            <main class="p-4">
                <h1 class="mb-4">Регистрация</h1>

                <form>
                    <div class="mb-3">
                        <label for="signup-login" class="form-label">Логин</label>
                        <input type="text"
                               id="signup-login"
                               name="login"
                               class="form-control"
                               autocomplete="username"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="signup-email" class="form-label">Email</label>
                        <input type="email"
                               id="signup-email"
                               name="email"
                               class="form-control"
                               autocomplete="email"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="signup-name" class="form-label">Имя</label>
                        <input type="text"
                               id="signup-name"
                               name="name"
                               class="form-control"
                               autocomplete="name"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="signup-password" class="form-label">Пароль</label>
                        <input type="password"
                               id="signup-password"
                               name="password"
                               class="form-control"
                               autocomplete="new-password"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="signup-password-repeat" class="form-label">
                            Повторите пароль
                        </label>
                        <input type="password"
                               id="signup-password-repeat"
                               name="password_repeat"
                               class="form-control"
                               autocomplete="new-password"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="signup-avatar" class="form-label">Аватар</label>
                        <input type="file"
                               id="signup-avatar"
                               name="avatar"
                               class="form-control"
                               accept="image/*">
                    </div>

                    <button type="button" class="btn btn-primary">
                        Зарегистрироваться
                    </button>

                    <p class="mt-3">
                        Уже есть аккаунт? <a href="login.html">Войти</a>
                    </p>
                </form>
            </main>

            <aside class="sidebar">
                <section class="sidebar-section">
                    <h2 class="sidebar-title">Популярные теги</h2>

                    <div class="sidebar-tags">
                        <a href="tag.html?tag=python" class="badge text-bg-primary">Python</a>
                        <a href="tag.html?tag=django" class="badge text-bg-primary">Django</a>
                        <a href="tag.html?tag=html" class="badge text-bg-primary">HTML</a>
                    </div>
                </section>

                <section class="sidebar-section">
                    <h2 class="sidebar-title">Лучшие пользователи</h2>

                    <ol class="sidebar-members">
                        <li><a href="profile.html">Пользователь 1</a></li>
                        <li><a href="profile.html">Пользователь 2</a></li>
                        <li><a href="profile.html">Пользователь 3</a></li>
                    </ol>
                </section>
            </aside>
        </div>

        <footer>
            <p class="text-default">2026-VK-EDU-Web-11-Pugovkin-M</p>
        </footer>
    </body>
</html>
