<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>VK ответы</title>
        <meta name="description" content="Сайт">
        <link rel="stylesheet" href="static/css/bootstrap.min.css">
        <link rel="stylesheet" href="static/css/styles.css">
    </head>

    <body>
        <header>
            <div class="container-fluid header-div">

                <a href="index.html">
                    <img src="static/img/header-logo.png"
                         alt="VK ответы"
                         class="header-logo">
                </a>

                <div>
                    <input id="value"
                   name="value"
                   type="search"
                   placeholder="Найти вопрос"
                   required>
                    <a href="ask.html" class="btn btn-primary">Задать вопрос</a>
                </div>

                <nav class="header-auth" aria-label="Авторизация">
                    <a href="signup.html" class="btn btn-primary">Register</a>
                    <a href="login.html" class="btn btn-outline-primary">Log in</a>
                </nav>

            </div>
        </header>

        <div class="content-layout">
            <main class="p-4">
                <h1 class="mb-4">Задать вопрос</h1>

                <form>
                    <div class="mb-3">
                        <label for="question-title" class="form-label">Заголовок</label>
                        <input type="text"
                               id="question-title"
                               name="title"
                               class="form-control"
                               maxlength="150"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="question-text" class="form-label">Текст вопроса</label>
                        <textarea id="question-text"
                                  name="text"
                                  class="form-control"
                                  rows="6"
                                  maxlength="5000"
                                  required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="question-tags" class="form-label">Теги</label>
                        <input type="text"
                               id="question-tags"
                               name="tags"
                               class="form-control"
                               placeholder="Python, Django"
                               maxlength="100">
                    </div>

                    <button type="submit" class="btn btn-primary">Опубликовать</button>
                </form>
            </main>

            <aside class="sidebar">
                <section class="sidebar-section">
                    <h2 class="sidebar-title">Популярные теги</h2>

                    <div class="sidebar-tags">
                        <a href="tag.html?tag=python" class="badge text-bg-primary">Python</a>
                        <a href="tag.html?tag=django" class="badge text-bg-primary">Django</a>
                        <a href="tag.html?tag=html" class="badge text-bg-primary">HTML</a>
                    </div>
                </section>

                <section class="sidebar-section">
                    <h2 class="sidebar-title">Лучшие пользователи</h2>

                    <ol class="sidebar-members">
                        <li><a href="profile.html">Пользователь 1</a></li>
                        <li><a href="profile.html">Пользователь 2</a></li>
                        <li><a href="profile.html">Пользователь 3</a></li>
                    </ol>
                </section>
            </aside>
        </div>

        <footer>
            <p class="text-default">2026-VK-EDU-Web-11-Pugovkin-M</p>
        </footer>
    </body>
</html>
