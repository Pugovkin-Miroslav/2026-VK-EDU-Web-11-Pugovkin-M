{% load static %}
<div>
    <form class="votes" method="post" action="{% url vote_route %}"
          data-vote-form data-login-url="{% url 'core:login' %}"
          {% if not request.user.is_authenticated %}title="Войдите, чтобы голосовать"{% endif %}>
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ target.pk }}">
        <span class="votes-count" data-vote-rating aria-live="polite">{{ target.rating }}</span>
        <button type="submit" name="value" value="1" class="votes-button" aria-label="Лайк"
                aria-pressed="{% if target.user_vote == 1 %}true{% else %}false{% endif %}"
                {% if request.user.is_authenticated %}title="Поставить или убрать лайк"{% else %}disabled{% endif %}>
            <img src="{% static 'core/img/like.png' %}" alt="">
        </button>
        <button type="submit" name="value" value="-1" class="votes-button" aria-label="Дизлайк"
                aria-pressed="{% if target.user_vote == -1 %}true{% else %}false{% endif %}"
                {% if request.user.is_authenticated %}title="Поставить или убрать дизлайк"{% else %}disabled{% endif %}>
            <img src="{% static 'core/img/dislike.png' %}" alt="">
        </button>
    </form>
    <p class="small text-danger mb-0" data-vote-error role="alert" hidden></p>
</div>
